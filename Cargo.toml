[package]
name = "bdk_wallet"
homepage = "https://bitcoindevkit.org"
version = "3.1.0"
repository = "https://github.com/bitcoindevkit/bdk_wallet"
documentation = "https://docs.rs/bdk_wallet"
description = "A modern, lightweight, descriptor-based wallet library"
keywords = ["bitcoin", "wallet", "descriptor", "psbt"]
readme = "README.md"
license = "MIT OR Apache-2.0"
authors = ["Bitcoin Dev Kit Developers"]
edition = "2024"
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "bdk_wallet_unstable"]

[package.metadata.rbmt.toolchains]
nightly = "nightly-2026-04-01"
stable = "1.96.0"

[package.metadata.rbmt.test]
# Exclude the all-keys alias and implicit dependency features from automatic discovery.
# Their functionality is covered by keys-bip39 and file_store.
exclude_features = ["all-keys", "bip39", "bdk_file_store"]
# Explicitly test downstream configurations in addition to RBMT's automatic matrix.
exact_features = [
    ["std", "keys-bip39"],
    ["rusqlite", "keys-bip39"],
    ["rusqlite", "keys-bip39", "compiler"],
    ["std", "bdk-tx"],
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)', 'cfg(bdk_wallet_unstable)'] }

[dependencies]
bdk_chain = { version = "0.23.3", features = ["miniscript", "serde"], default-features = false }
bdk_tx = { version = "0.2.0", default-features = false, optional = true }
bitcoin = { version = "0.32.8", features = ["serde"], default-features = false }
hashbrown = { version = "0.14.5", default-features = false, features = ["ahash", "serde"] }
miniscript = { version = "12.3.7", features = ["serde", "no-std"], default-features = false } # blame: bdk_tx@0.2.0 requires miniscript >=12.3.7
rand_core = { version = "0.6.4" }
serde_json = { version = "1.0.80", default-features = false, features = ["alloc"] }
serde = { version = "1.0.219", default-features = false, features = ["derive", "alloc"] }

# Optional dependencies
bdk_file_store = { version = "0.22.0", optional = true }
bip39 = { version = "2.2.2", optional = true }


[features]
default = ["std"]
std = ["bitcoin/std", "bitcoin/rand-std", "bitcoin/base64", "serde/std", "serde_json/std", "miniscript/std", "bdk_chain/std", "bdk_tx?/std"]
compiler = ["miniscript/compiler"]
all-keys = ["keys-bip39"]
keys-bip39 = ["bip39"]
rusqlite = ["std", "bdk_chain/rusqlite"]
file_store = ["std", "bdk_file_store"]
bdk-tx = ["dep:bdk_tx"]
test-utils = ["std"]

[dev-dependencies]
anyhow = "1.0.66"
assert_matches = "1.5.0"
bdk_bitcoind_rpc = { version = "0.22.0" }
bdk_electrum = { version = "0.23.2" }
bdk_esplora = { version = "0.22.1", features = ["async-https", "blocking-https", "tokio"] }
bdk_tx = { version = "0.2.0" }
bdk_wallet = { path = ".", features = ["rusqlite", "file_store", "test-utils"] }
clap = { version = "4.5.60", features = ["derive", "env"] }
ctrlc = "3.5.2"
rand = "0.8"
tempfile = "3.26.0"
tokio = { version = "1.38.1", features = ["rt", "rt-multi-thread", "macros"] }

# Transitive dependency lower bounds for minimal-version testing:
bincode = { version = "1.3.0" } # blame: bdk_file_store@0.22.0 -> bincode (Options::with_varint_encoding)
bitcoin-units = { version = "0.1.3" } # blame: bitcoin@0.32.8 -> bitcoin-units
thiserror = { version = "1.0.56" } # blame: bdk_esplora@0.22.1 -> esplora-client -> reqwest -> tokio-socks (#[from] derives)
native-tls = { version = "0.2.13" } # blame: bdk_esplora@0.22.1 -> esplora-client -> reqwest -> native-tls

[[example]]
name = "mnemonic_to_descriptors"
path = "examples/mnemonic_to_descriptors.rs"
required-features = ["all-keys"]

[[example]]
name = "miniscriptc"
path = "examples/compiler.rs"
required-features = ["compiler"]

[[example]]
name = "electrum"

[[example]]
name = "esplora_async"

[[example]]
name = "esplora_blocking"

[[example]]
name = "bitcoind_rpc"

[[example]]
name = "psbt"
required-features = ["bdk-tx"]

[[example]]
name = "replace_by_fee"
required-features = ["bdk-tx"]

