name: Setup cargo-rbmt
description: Install the pinned RBMT version and configured Rust toolchains
runs:
  using: composite
  steps:
    - name: Cache cargo-rbmt
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cargo-rbmt
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-rbmt-${{ hashFiles('rbmt-version') }}
    - name: Install cargo-rbmt
      shell: bash
      run: ./ci/install-rbmt.sh
    - name: Install Rust toolchains
      shell: bash
      # Ensure required components and targets are added to preinstalled toolchains.
      run: cargo rbmt toolchains --force
