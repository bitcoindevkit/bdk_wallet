on: [push, pull_request]

# Main continuous integration workflow that runs build, test, and code quality checks.
# Runs on every push and pull request, testing against both MSRV (1.85) and stable Rust.
# Includes no_std and WASM compatibility checks, formatting validation, and clippy linting.

name: CI

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-msrv:
    name: Build & Test MSRV
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The 'toolchain' argument on this action overrides the Rust compiler version set in rust-toolchain.toml
      # in order to test our MSRV.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: 1.85 # MSRV
          cache: true
          rustflags: "-D warnings"
      - name: Pin dependencies for MSRV
        run: ./ci/pin-msrv.sh
      - name: Build (no default features)
        run: |
          cargo build --workspace --no-default-features --features miniscript/no-std,bdk_chain/hashbrown
      - name: Test all features
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
          RUSTDOCFLAGS: "--cfg bdk_wallet_unstable"
        run: |
          cargo test --workspace --all-features

  build-test-stable:
    name: Build & Test Rust Stable
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action will honor the Rust compiler version set in rust-toolchain.toml. We aim to keep it in sync with
      # Rust stable.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          rustflags: "-D warnings"
      - name: Build (no default features)
        run: |
          cargo build --workspace --no-default-features --features miniscript/no-std,bdk_chain/hashbrown
      - name: Test all features
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
          RUSTDOCFLAGS: "--cfg bdk_wallet_unstable"
        run: |
          cargo test --workspace --all-features

  check-no-std:
    name: Check no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          rustflags: "-D warnings"
      - name: Check no-std
        # TODO "--target thumbv6m-none-eabi" should work but currently does not
        run: cargo check --no-default-features --features miniscript/no-std,bdk_chain/hashbrown

  check-wasm:
    name: Check WASM
    runs-on: ubuntu-latest
    env:
      # `secp256k1-sys` compiles a bit of C (wasm/wasm.c) for wasm32, so we need a C compiler
      # that can target wasm32. GCC can't, but clang can — and the ubuntu runner image already
      # ships clang (>= 16), so no extra packages are needed.
      CC: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          target: wasm32-unknown-unknown
          rustflags: "-D warnings"
      - name: Check WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check --target wasm32-unknown-unknown --no-default-features --features miniscript/no-std,bdk_chain/hashbrown

  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The 'toolchain' argument on this action overrides the Rust compiler version set in rust-toolchain.toml
      # Pinned nightly for formatting; keep in sync with NIGHTLY in the justfile
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: nightly-2026-10-27
          components: rustfmt
          cache: true
      - name: Check fmt
        run: cargo +nightly-2026-10-27 fmt --all --check

  clippy_check:
    name: Rust clippy
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          rustflags: "-D warnings"
      - name: Clippy
        env:
          RUSTFLAGS: "-D warnings --cfg bdk_wallet_unstable"
        run: cargo clippy --all-features --all-targets

  docs_check:
    name: Check cargo doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache: true
          rustflags: "-D warnings"
      - name: Check docs
        env: 
          RUSTDOCFLAGS: "-D warnings --cfg bdk_wallet_unstable"
        run: cargo doc --workspace --all-features --no-deps

  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all commits are GPG signed
        run: ./ci/check-signed-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
