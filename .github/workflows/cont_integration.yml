on: [push, pull_request]

# Main continuous integration workflow that runs build, test, and code quality checks.
# Runs on every push and pull request, testing against both MSRV (1.85) and stable Rust.
# Includes no_std and WASM compatibility checks, formatting validation, and clippy linting.

name: CI

permissions: {}

env:
  CARGO_TERM_COLOR: always
  # secp256k1's C code also needs a compiler for RBMT's embedded target.
  CC_thumbv7m_none_eabi: clang

jobs:
  build-test-msrv:
    name: Build & Test MSRV
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Bootstrap RBMT with stable Rust; RBMT selects the manifest MSRV for tests.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.96.0 # RBMT itself requires Rust >=1.88
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Build and test feature combinations
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
          RUSTDOCFLAGS: "--cfg bdk_wallet_unstable"
        run: cargo rbmt test --toolchain msrv --lockfile minimal

  build-test-stable:
    name: Build & Test Rust Stable
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action will honor the Rust compiler version set in rust-toolchain.toml. We aim to keep it in sync with
      # Rust stable.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Build and test feature combinations
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
          RUSTDOCFLAGS: "--cfg bdk_wallet_unstable"
        run: cargo rbmt test --toolchain stable --lockfile recent

  check-lockfiles:
    name: Check lockfiles are current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: Regenerate lockfiles
        run: cargo rbmt lock
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
      - name: Verify lockfiles are up-to-date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Lockfiles are stale — run: just lock'
            git status --porcelain
            exit 1
          fi

  check-no-std:
    name: Check no_std
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Check no-std
        run: cargo rbmt run --toolchain stable --lockfile recent -- check --target thumbv7m-none-eabi --no-default-features

  check-wasm:
    name: Check WASM
    runs-on: ubuntu-latest
    env:
      CC: clang-14
      CFLAGS: -I/usr/include
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        # Install a recent version of clang that supports wasm32
      - run: wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add - || exit 1
      - run: sudo apt-get update || exit 1
      - run: sudo apt-get install -y libclang-common-14-dev clang-14 libc6-dev-i386 || exit 1
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          target: wasm32-unknown-unknown
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Check WASM
        run: |
          rustup target add wasm32-unknown-unknown
          cargo rbmt run --toolchain stable --lockfile recent -- check --target wasm32-unknown-unknown --no-default-features
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Check fmt
        run: cargo rbmt fmt --check

  clippy_check:
    name: Rust clippy
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Clippy
        env:
          RUSTFLAGS: "--cfg bdk_wallet_unstable"
        run: cargo rbmt lint

  docs_check:
    name: Check cargo doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # This action automatically reads and applies rust-toolchain.toml
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
      - name: Setup cargo-rbmt
        uses: ./.github/actions/setup-rbmt
      - name: Check docs
        env:
          RUSTDOCFLAGS: "-D warnings --cfg bdk_wallet_unstable"
        run: cargo rbmt run --toolchain stable --lockfile recent -- doc --workspace --all-features --no-deps

  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify all commits are GPG signed
        run: ./ci/check-signed-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
