[workspace]
# Return to release tags with `wallet-` prefix, for example `wallet-3.2.0`. Keep
# the same scheme so release-plz can find the previous release and GitHub releases
# stays consistent.
git_tag_name = 'wallet-{{ version }}'
git_release_name = '{{ version }}'
# Mark `-rc.N` and other pre-release versions as GitHub pre-releases.
git_release_type = "auto"
# Only publish after a release PR has been merged.
release_always = false
# Keep the label exempted by the stale-issue workflow.
pr_labels = ["release"]

# release-plz updates the changelog next to Cargo.toml, which is the default
# location, and bumps the version in Cargo.toml.
[[package]]
name = "bdk_wallet"
changelog_path = "CHANGELOG.md"
